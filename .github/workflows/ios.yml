name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project BarTab.xcodeproj \
            -scheme BarTab \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "BarTab.app" -type d | head -1)
          echo "Found app at: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r BarTab.ipa Payload
          ls -lh BarTab.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BarTab
          path: BarTab.ipa
