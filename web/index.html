<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    OpenGraph tags: these are what iMessage / WhatsApp / etc. read to
    render a rich preview when someone shares https://bartap.info/bar/<id>
    or https://bartap.info/group/<id>.
    Replace the title/description dynamically per bar/group server-side.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Check this out on BarTab 🍺" />
  <meta property="og:description" content="See drink prices, compare bars and find the best deal." />
  <meta property="og:image" content="https://bartap.info/og.png" />
  <meta property="og:url" content="https://bartap.info/" />
  <meta property="og:site_name" content="BarTab" />

  <!-- Smart App Banner (add your real App Store id once live) -->
  <meta name="apple-itunes-app" content="app-id=0000000000" />

  <title>BarTab</title>
</head>
<body style="font-family:-apple-system,Helvetica,Arial,sans-serif;margin:0;padding:48px;text-align:center;background:#1c1c1e;color:#fff;">
  <h1 style="font-size:40px;margin:0 0 8px;">🍺 BarTab</h1>
  <p style="color:#999;">Open this link in the BarTab app to see the bar.</p>
  <p style="color:#666;font-size:14px;">Don't have the app? It'll be on the App&nbsp;Store soon.</p>
</body>
</html>
